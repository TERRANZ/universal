plugins {
    id 'java'
}

group = 'ru.terra.universal'
version = '2'

subprojects {
    repositories {
        mavenCentral()
    }

    apply plugin: 'java'
    apply plugin: 'application'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    dependencies {
        implementation "io.netty:netty-all:4.2.19.Final"
        implementation "org.apache.logging.log4j:log4j-api:2.26.1"
        runtimeOnly "org.apache.logging.log4j:log4j-core:2.26.1"
        implementation "org.reflections:reflections:0.9.8"
        implementation "net.sf.flexjson:flexjson:2.1"
        implementation "commons-configuration:commons-configuration:1.9"

        testImplementation "junit:junit:4.12"
    }

    application {
        mainClass = 'ru.terra.universal.server.Main'
    }

    tasks.named('jar', Jar) {
        manifest.attributes('Main-Class': application.mainClass.get())
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        from {
            configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
        }
    }
}
