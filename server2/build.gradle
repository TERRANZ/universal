plugins {
    id 'java'
}

group = 'ru.terra.universal'
version = '2'

subprojects {
    repositories {
        mavenCentral()
    }

    apply plugin: 'java'
    apply plugin: 'application'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    tasks.withType(Test).configureEach {
        systemProperty 'file.encoding', 'UTF-8'
    }

    dependencies {
        implementation "io.netty:netty-all:4.2.19.Final"
        implementation "org.apache.logging.log4j:log4j-api:2.26.1"
        runtimeOnly "org.apache.logging.log4j:log4j-core:2.26.1"
        // reflections logs through SLF4J; route it to Log4j 2 instead of NOP.
        runtimeOnly "org.apache.logging.log4j:log4j-slf4j-impl:2.26.1"
        implementation "org.reflections:reflections:0.10.2"
        implementation "net.sf.flexjson:flexjson:3.3"
        implementation "org.apache.commons:commons-configuration2:2.15.1"
        // commons-configuration2 declares beanutils as optional, but it is
        // required at runtime by AbstractConfiguration.
        runtimeOnly "commons-beanutils:commons-beanutils:1.11.0"

        testImplementation platform("org.junit:junit-bom:5.14.4")
        testImplementation "org.junit.jupiter:junit-jupiter"
        testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    }

    test {
        useJUnitPlatform()
    }

    application {
        mainClass = 'ru.terra.universal.server.Main'
    }

    tasks.named('jar', Jar) {
        manifest.attributes('Main-Class': application.mainClass.get())
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        from {
            configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
        }
    }
}
